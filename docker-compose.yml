services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - finance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://finance:finance@postgres:5432/finance?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars
      JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-chars
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL_DAYS: 7
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  finance_postgres_data:
